name: Weekly Contribution Report

on:
  schedule:
    - cron: "29 18 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install reportlab matplotlib

      - name: Generate weekly report
        run: python generate_report.py weekly

      - name: Archive report
        run: |
          mkdir -p weekly_reports
          ls -lah weekly_reports/

      - name: Upload PDF report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-contribution-report
          path: weekly_reports/weekly_report_*.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f weekly_reports/*.pdf
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "docs: archive weekly Form-3 report [skip ci]"
            git push
          fi
